[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hthp-pinch-point"
version = "0.1.0"
description = "Modelo integrado de bomba de calor de alta temperatura com pinch point"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "CoolProp>=7.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
hthp = "hthp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
